services:
  - type: pserv
    name: credit-risk-mysql
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./deploy/mysql/Dockerfile
    dockerContext: .
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: credit_risk_evaluator
      - key: MYSQL_USER
        value: credit_risk_app
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: pserv
    name: credit-risk-ml
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./deploy/ml/Dockerfile
    dockerContext: .

  - type: web
    name: credit-risk-app
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    initialDeployHook: node scripts/sync.js && node scripts/importCsv.js
    envVars:
      - key: DB_HOST
        fromService:
          type: pserv
          name: credit-risk-mysql
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: credit_risk_evaluator
      - key: DB_USER
        value: credit_risk_app
      - key: DB_PASS
        fromService:
          type: pserv
          name: credit-risk-mysql
          envVarKey: MYSQL_PASSWORD
      - key: ML_API_URL
        value: http://credit-risk-ml:8000/predict
